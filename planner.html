<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attack Planner</title>
<style>
  :root { --bg:#1b1720; --panel:#26202d; --text:#eee; --muted:#a99bb8; --accent:#b06cff; }
  * { box-sizing:border-box; }
  html { scrollbar-gutter:stable; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:1; display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; background:var(--bg); padding:12px 16px; border-bottom:1px solid #3a3144; }
  h1 { font-size:20px; margin:0; }
  button, a.btn, label.btn { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; text-decoration:none; }
  .secondary { background:#3a3144 !important; }
  button:disabled { opacity:.4; cursor:default; }
  #side { position:sticky; top:64px; align-self:start; width:200px; flex:0 0 200px; display:flex; flex-direction:column; gap:6px; }
  #side h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:8px 0 2px; }
  #side button { display:flex; align-items:center; gap:6px; background:var(--panel); border:2px solid #3a3144; padding:4px 10px 4px 4px; width:100%; }
  #side button[aria-pressed=true] { border-color:var(--accent); background:#3a2a4d; }
  #side img { height:32px; image-rendering:pixelated; }
  #side small { color:var(--muted); margin-left:auto; }
  #side .emoji { font-size:26px; width:32px; text-align:center; }
  #side label { color:var(--muted); font-size:13px; margin-top:8px; border-top:1px solid #3a3144; padding-top:10px; }
  #side input[type=range] { width:100%; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:10px 16px; color:var(--muted); }
  #housing { color:var(--text); }
  main { padding:0 16px 24px; display:flex; gap:16px; align-items:flex-start; }
  #stage { flex:1; min-width:0; }
  #drop { border:2px dashed #3a3144; border-radius:8px; min-height:60vh; display:grid; place-items:center; color:var(--muted); text-align:center; padding:16px; }
  #drop.over { border-color:var(--accent); }
  canvas { display:block; max-width:100%; max-height:calc(100vh - 130px); margin:0 auto; cursor:crosshair; touch-action:none; }
  input[type=file] { display:none; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Attack Planner</h1>
  <a class="btn secondary" href="index.html">Shadow GIFs</a>
  <a class="btn secondary" href="replay.html">Attack Replay</a>
</header>
<div class="bar">
  <label class="btn">Upload image<input id="file" type="file" accept="image/*"></label>
  <label>Head size <input id="size" type="range" min="1" max="15" step="0.5" value="4"> <output id="sizeVal">4</output>%</label>
  <button id="undo" type="button" class="secondary" disabled>Undo</button>
  <button id="clear" type="button" class="secondary" disabled>Clear</button>
  <button id="download" type="button" disabled>Download</button>
  <button id="copy" type="button" disabled>Copy</button>
  <span id="housing">Housing: 0</span>
</div>
<main>
  <aside id="side">
    <h2>Troops</h2>
    <nav id="mobs"></nav>
    <h2>Spells</h2>
    <nav id="spells">
      <button type="button" data-mob="heal"><span class="emoji">💛</span><span>heal</span></button>
    </nav>
    <label>Heal radius <output id="healVal">25</output>px
      <input id="heal" type="range" min="5" max="200" step="1" value="25">
    </label>
  </aside>
  <div id="stage">
    <div id="drop">Upload, drop or paste (Ctrl+V) a screenshot of the base.<br>Pick a troop or spell on the left, then click on the image to place it. Drag it to move it, right-click to remove it.</div>
    <canvas id="c" hidden></canvas>
  </div>
</main>
<script src="icons.js?v=5"></script>
<script src="font.js?v=1"></script>
<script>
const MOBS = { zombie: 1, skeleton: 1, iron_golem: 5, creeper: 2, chicken: 5, enderman: 1, witch: 4, allay: 14 };  // housing space
const $ = id => document.getElementById(id), c = $("c"), ctx = c.getContext("2d");
const icons = {};
let bg = null, heads = [], mob = "zombie", drag = null, hover = null;

// MC font glyph masks from ascii.png, for the stats strip under the image
const glyphs = {}, font = new Image();
font.onload = () => {
  const t = document.createElement("canvas");
  t.width = font.width; t.height = font.height;
  const tc = t.getContext("2d");
  tc.drawImage(font, 0, 0);
  const d = tc.getImageData(0, 0, font.width, font.height).data;
  const cw = font.width / [...CHARS[0]].length, ch = font.height / CHARS.length;
  CHARS.forEach((line, row) => [...line].forEach((ch_, col) => {
    const mask = [];
    let w = 0;
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++)
      if (d[((row * ch + y) * font.width + col * cw + x) * 4 + 3]) { mask.push([x, y]); w = Math.max(w, x + 1); }
    glyphs[ch_] = { w, mask };
  }));
  glyphs[" "] = { w: 3, mask: [] };
  draw();
};
font.src = FONT_PNG;
const glyph = ch => glyphs[ch] || glyphs["?"];
const textW = s => [...s].reduce((w, ch) => w + glyph(ch).w + 1, 0);
function text(s, x, y, px, color, shadow) {  // MC text with its drop shadow (colour / 4, 1 px down-right); returns end x
  for (const [col, o] of [[shadow, px], [color, 0]]) {
    let cx = x;
    ctx.fillStyle = col;
    for (const ch of s) {
      for (const [gx, gy] of glyph(ch).mask) ctx.fillRect(cx + gx * px + o, y + gy * px + o, px, px);
      cx += (glyph(ch).w + 1) * px;
    }
  }
  return x + textW(s) * px;
}
const px = () => Math.max(2, Math.round(bg.width / 320));

for (const [name, space] of Object.entries(MOBS)) {
  const img = icons[name] = new Image();
  img.src = window.ICONS.Mobs[name];
  img.onload = draw;
  const b = document.createElement("button");
  b.type = "button"; b.dataset.mob = name;
  b.innerHTML = `<img src="${img.src}" alt=""><span>${name.replace("_", " ")}</span><small>${space}</small>`;
  b.onclick = () => { mob = name; pressed(); };
  $("mobs").append(b);
}
const pressed = () => document.querySelectorAll("#side button[data-mob]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mob === mob));
document.querySelector("#spells button").onclick = () => { mob = "heal"; pressed(); };
pressed();

const isSpell = h => h.mob === "heal";
// head box in image px: size is the longer side, as a % of the image width
function box(h) {
  if (isSpell(h)) { const r = +$("heal").value; return { x: h.x - r, y: h.y - r, w: 2 * r, h: 2 * r }; }
  const img = icons[h.mob], s = bg.width * $("size").value / 100, k = s / Math.max(img.width, img.height);
  const w = img.width * k, hh = img.height * k;
  return { x: h.x - w / 2, y: h.y - hh / 2, w, h: hh };
}
function paint(h) {
  const b = box(h);
  if (isSpell(h)) {
    const r = b.w / 2;
    ctx.beginPath();
    ctx.arc(h.x, h.y, r, 0, 2 * Math.PI);
    ctx.fillStyle = "rgba(255,226,70,.22)";
    ctx.fill();
    ctx.strokeStyle = "rgba(255,226,70,.55)";
    ctx.lineWidth = Math.max(1, r / 25);
    ctx.stroke();
    return;
  }
  const o = Math.max(1, b.w / 16);
  ctx.fillStyle = "#000";  // thin dark frame so heads read on any background
  ctx.fillRect(b.x - o, b.y - o, b.w + 2 * o, b.h + 2 * o);
  ctx.drawImage(icons[h.mob], b.x, b.y, b.w, b.h);
}
function draw() {
  if (!bg) return;
  const count = {}, troops = heads.filter(h => !isSpell(h));
  for (const h of troops) count[h.mob] = (count[h.mob] || 0) + 1;
  const total = troops.reduce((s, h) => s + MOBS[h.mob], 0);
  // stats strip items (head + count per mob, then totals), wrapped into rows that fit the image width
  const p = px(), items = [];
  if (glyphs["?"]) {
    for (const m of Object.keys(MOBS).filter(m => count[m])) {
      const img = icons[m], k = 10 * p / Math.max(img.width, img.height), s = `${count[m]}x`;
      items.push({ img, k, s, w: img.width * k + 2 * p + textW(s) * p, color: "#fff", shadow: "#3f3f3f" });
    }
    const s = `Units: ${troops.length}  Housing: ${total}`;
    items.push({ s, w: textW(s) * p, color: "#ffff55", shadow: "#3f3f15" });
  }
  const rows = [[]];
  let rw = 4 * p;
  for (const it of items) {
    if (rows.at(-1).length && rw + it.w > c.width - 4 * p) { rows.push([]); rw = 4 * p; }
    rows.at(-1).push(it); rw += it.w + 6 * p;
  }
  const spells = heads.length - troops.length;  // spells get their own row under the troops
  if (spells && glyphs["?"]) {
    const s = `${spells}x heal`;
    rows.push([{ emoji: "💛", s, w: 12 * p + textW(s) * p, color: "#ffff55", shadow: "#3f3f15" }]);
  }
  const h = bg.height + (2 + 12 * rows.length) * p;  // 12 MC px per row: 10 px heads + gap
  if (c.height !== h) c.height = h;  // resizing clears the canvas; everything is redrawn below
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(bg, 0, 0);
  ctx.imageSmoothingEnabled = false;  // crisp MC pixels
  heads.filter(isSpell).forEach(paint);  // spells under the heads
  troops.forEach(paint);
  if (hover && !drag && hover.y < bg.height) {  // ghost of what the next click places
    ctx.globalAlpha = .5;
    paint({ mob, ...hover });
    ctx.globalAlpha = 1;
  }
  // stats strip under the image (part of the downloaded/copied PNG)
  ctx.fillStyle = "#1b1720";
  ctx.fillRect(0, bg.height, c.width, c.height - bg.height);
  rows.forEach((row, r) => {
    const y = bg.height + (2 + 12 * r) * p;
    let x = 4 * p;
    for (const it of row) {
      if (it.img) ctx.drawImage(it.img, x, y + (10 * p - it.img.height * it.k) / 2, it.img.width * it.k, it.img.height * it.k);
      if (it.emoji) {
        ctx.font = `${10 * p}px sans-serif`;
        ctx.textBaseline = "top";
        ctx.fillStyle = "#fff";
        ctx.fillText(it.emoji, x, y);
      }
      text(it.s, x + (it.img ? it.img.width * it.k + 2 * p : it.emoji ? 12 * p : 0), y + p, p, it.color, it.shadow);
      x += it.w + 6 * p;
    }
  });
  $("housing").textContent = `Housing: ${total}` + (heads.length ? "  (" + Object.entries(count).map(([m, n]) => `${n}× ${m.replace("_", " ")}`).join(", ") + ")" : "");
  $("undo").disabled = $("clear").disabled = !heads.length;
}

function load(file) {
  if (!file?.type.startsWith("image/")) return;
  const img = new Image();
  img.onload = () => {
    bg = img; heads = [];
    c.width = img.width; c.height = img.height;  // draw() adds the stats strip
    c.hidden = false; $("drop").hidden = true; $("download").disabled = $("copy").disabled = false;
    URL.revokeObjectURL(img.src);
    draw();
  };
  img.src = URL.createObjectURL(file);
}
$("file").onchange = e => load(e.target.files[0]);
document.addEventListener("paste", e => load([...e.clipboardData.files][0]));
for (const el of [$("drop"), c]) {
  el.addEventListener("dragover", e => { e.preventDefault(); $("drop").classList.add("over"); });
  el.addEventListener("dragleave", () => $("drop").classList.remove("over"));
  el.addEventListener("drop", e => { e.preventDefault(); $("drop").classList.remove("over"); load(e.dataTransfer.files[0]); });
}

// pointer -> image px (canvas is shown scaled down)
const at = e => { const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height }; };
const hit = p => heads.findLastIndex(h => { const b = box(h); return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; });
c.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  const p = at(e), i = hit(p);
  if (i >= 0) {
    const [h] = heads.splice(i, 1);
    heads.push(h);  // bring to front
    drag = { h, dx: h.x - p.x, dy: h.y - p.y };
  } else {
    if (p.y < bg.height) heads.push({ mob, ...p });
  }
  c.setPointerCapture(e.pointerId);
  draw();
});
c.addEventListener("pointermove", e => {
  const p = at(e);
  hover = p;
  if (drag) { drag.h.x = p.x + drag.dx; drag.h.y = Math.min(bg.height, p.y + drag.dy); }
  draw();
});
c.addEventListener("pointerleave", () => { hover = null; draw(); });
c.addEventListener("pointerup", () => { drag = null; draw(); });
c.addEventListener("contextmenu", e => {
  e.preventDefault();
  const i = hit(at(e));
  if (i >= 0) { heads.splice(i, 1); draw(); }
});
$("size").oninput = () => { $("sizeVal").value = $("size").value; draw(); };
$("heal").oninput = () => { $("healVal").value = $("heal").value; draw(); };
$("undo").onclick = () => { heads.pop(); draw(); };
$("clear").onclick = () => { heads = []; draw(); };
$("download").onclick = () => c.toBlob(blob => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "attack-plan.png"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}, "image/png");
$("copy").onclick = async () => {  // Promise<Blob> keeps the click activation
  await navigator.clipboard.write([new ClipboardItem({ "image/png": new Promise(res => c.toBlob(res, "image/png")) })]);
  $("copy").textContent = "Copied!";
  setTimeout(() => $("copy").textContent = "Copy", 1200);
};
</script>
</body>
</html>
