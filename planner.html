<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attack Planner</title>
<style>
  :root { --bg:#1b1720; --panel:#26202d; --text:#eee; --muted:#a99bb8; --accent:#b06cff; }
  * { box-sizing:border-box; }
  html { scrollbar-gutter:stable; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:1; display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; background:var(--bg); padding:12px 16px; border-bottom:1px solid #3a3144; }
  h1 { font-size:20px; margin:0; }
  button, a.btn, label.btn { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; text-decoration:none; }
  .secondary { background:#3a3144 !important; }
  button:disabled { opacity:.4; cursor:default; }
  #mobs { display:flex; flex-wrap:wrap; gap:6px; }
  #mobs button { display:flex; align-items:center; gap:6px; background:var(--panel); border:2px solid #3a3144; padding:4px 10px 4px 4px; }
  #mobs button[aria-pressed=true] { border-color:var(--accent); background:#3a2a4d; }
  #mobs img { height:32px; image-rendering:pixelated; }
  #mobs small { color:var(--muted); }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:10px 16px; color:var(--muted); }
  #housing { color:var(--text); }
  main { padding:0 16px 24px; }
  #drop { border:2px dashed #3a3144; border-radius:8px; min-height:60vh; display:grid; place-items:center; color:var(--muted); text-align:center; padding:16px; }
  #drop.over { border-color:var(--accent); }
  canvas { display:block; max-width:100%; max-height:calc(100vh - 130px); margin:0 auto; cursor:crosshair; touch-action:none; }
  input[type=file] { display:none; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Attack Planner</h1>
  <a class="btn secondary" href="index.html">Shadow GIFs</a>
  <nav id="mobs"></nav>
</header>
<div class="bar">
  <label class="btn">Upload image<input id="file" type="file" accept="image/*"></label>
  <label>Head size <input id="size" type="range" min="1" max="15" step="0.5" value="4"> <output id="sizeVal">4</output>%</label>
  <button id="undo" type="button" class="secondary" disabled>Undo</button>
  <button id="clear" type="button" class="secondary" disabled>Clear</button>
  <button id="download" type="button" disabled>Download</button>
  <span id="housing">Housing: 0</span>
</div>
<main>
  <div id="drop">Upload, drop or paste (Ctrl+V) a screenshot of the base.<br>Pick a mob above, then click on the image to place it. Drag a head to move it, right-click to remove it.</div>
  <canvas id="c" hidden></canvas>
</main>
<script src="icons.js?v=5"></script>
<script>
const MOBS = { zombie: 1, skeleton: 1, iron_golem: 5, chicken: 5, enderman: 1, witch: 4, allay: 5 };  // housing space
const $ = id => document.getElementById(id), c = $("c"), ctx = c.getContext("2d");
const icons = {};
let bg = null, heads = [], mob = "zombie", drag = null;

for (const [name, space] of Object.entries(MOBS)) {
  const img = icons[name] = new Image();
  img.src = window.ICONS.Mobs[name];
  img.onload = draw;
  const b = document.createElement("button");
  b.type = "button"; b.dataset.mob = name;
  b.innerHTML = `<img src="${img.src}" alt=""><span>${name.replace("_", " ")}</span><small>${space}</small>`;
  b.onclick = () => { mob = name; pressed(); };
  $("mobs").append(b);
}
const pressed = () => document.querySelectorAll("#mobs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mob === mob));
pressed();

// head box in image px: size is the longer side, as a % of the image width
function box(h) {
  const img = icons[h.mob], s = bg.width * $("size").value / 100, k = s / Math.max(img.width, img.height);
  const w = img.width * k, hh = img.height * k;
  return { x: h.x - w / 2, y: h.y - hh / 2, w, h: hh };
}
function draw() {
  if (!bg) return;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(bg, 0, 0);
  ctx.imageSmoothingEnabled = false;  // crisp MC pixels
  for (const h of heads) {
    const b = box(h), o = Math.max(1, b.w / 16);
    ctx.fillStyle = "#000";  // thin dark frame so heads read on any background
    ctx.fillRect(b.x - o, b.y - o, b.w + 2 * o, b.h + 2 * o);
    ctx.drawImage(icons[h.mob], b.x, b.y, b.w, b.h);
  }
  const count = {};
  for (const h of heads) count[h.mob] = (count[h.mob] || 0) + 1;
  const total = heads.reduce((s, h) => s + MOBS[h.mob], 0);
  $("housing").textContent = `Housing: ${total}` + (heads.length ? "  (" + Object.entries(count).map(([m, n]) => `${n}× ${m.replace("_", " ")}`).join(", ") + ")" : "");
  $("undo").disabled = $("clear").disabled = !heads.length;
}

function load(file) {
  if (!file?.type.startsWith("image/")) return;
  const img = new Image();
  img.onload = () => {
    bg = img; heads = [];
    c.width = img.width; c.height = img.height;
    c.hidden = false; $("drop").hidden = true; $("download").disabled = false;
    URL.revokeObjectURL(img.src);
    draw();
  };
  img.src = URL.createObjectURL(file);
}
$("file").onchange = e => load(e.target.files[0]);
document.addEventListener("paste", e => load([...e.clipboardData.files][0]));
for (const el of [$("drop"), c]) {
  el.addEventListener("dragover", e => { e.preventDefault(); $("drop").classList.add("over"); });
  el.addEventListener("dragleave", () => $("drop").classList.remove("over"));
  el.addEventListener("drop", e => { e.preventDefault(); $("drop").classList.remove("over"); load(e.dataTransfer.files[0]); });
}

// pointer -> image px (canvas is shown scaled down)
const at = e => { const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height }; };
const hit = p => heads.findLastIndex(h => { const b = box(h); return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; });
c.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  const p = at(e), i = hit(p);
  if (i >= 0) {
    const [h] = heads.splice(i, 1);
    heads.push(h);  // bring to front
    drag = { h, dx: h.x - p.x, dy: h.y - p.y };
  } else {
    heads.push({ mob, ...p });
  }
  c.setPointerCapture(e.pointerId);
  draw();
});
c.addEventListener("pointermove", e => {
  if (!drag) return;
  const p = at(e);
  drag.h.x = p.x + drag.dx; drag.h.y = p.y + drag.dy;
  draw();
});
c.addEventListener("pointerup", () => drag = null);
c.addEventListener("contextmenu", e => {
  e.preventDefault();
  const i = hit(at(e));
  if (i >= 0) { heads.splice(i, 1); draw(); }
});
$("size").oninput = () => { $("sizeVal").value = $("size").value; draw(); };
$("undo").onclick = () => { heads.pop(); draw(); };
$("clear").onclick = () => { heads = []; draw(); };
$("download").onclick = () => c.toBlob(blob => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "attack-plan.png"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}, "image/png");
</script>
</body>
</html>
