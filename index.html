<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow GIFs</title>
<style>
  :root { --bg:#1b1720; --panel:#26202d; --text:#eee; --muted:#a99bb8; --accent:#b06cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, sans-serif; }
  main { max-width:1280px; margin:0 auto; padding:24px 16px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0 24px; align-items:start; }
  h1 { grid-column:1 / -1; }
  #icons { position:sticky; top:12px; max-height:calc(100vh - 24px); overflow-y:auto; background:var(--panel); border-radius:6px; padding:4px 10px 10px; }
  @media (max-width:800px) { main { grid-template-columns:minmax(0,1fr); } #icons { position:static; max-height:none; } }
  h1 { font-size:20px; margin:0 0 16px; }
  textarea { width:100%; min-height:110px; background:var(--panel); color:var(--text); border:1px solid #3a3144; border-radius:6px; padding:10px; font:inherit; }
  fieldset { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; margin:12px 0; border:1px solid #3a3144; border-radius:6px; padding:8px 12px 12px; color:var(--muted); }
  legend { color:var(--text); font-size:13px; padding:0 4px; }
  fieldset input[type=number] { width:70px; background:var(--panel); color:var(--text); border:1px solid #3a3144; border-radius:4px; padding:4px; }
  button, a.btn { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; text-decoration:none; }
  button.secondary, #tabs button[aria-pressed=false] { background:#3a3144; }
  #tabs { display:flex; gap:6px; margin-bottom:10px; }
  #icons .cat { margin:8px 0; }
  #icons .cat span { display:block; color:var(--muted); font-size:13px; margin-bottom:4px; }
  #icons .cat div { display:flex; flex-wrap:wrap; gap:4px; }
  #icons button { background:var(--bg); border:1px solid #3a3144; padding:4px; line-height:0; }
  #icons img { height:20px; image-rendering:pixelated; }
  #out { display:grid; gap:12px; margin-top:16px; }
  .item { background:var(--panel); border-radius:6px; padding:10px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  .item img, .item canvas { image-rendering:pixelated; max-width:100%; }
</style>
</head>
<body>
<main>
  <h1>Shadow GIFs</h1>
  <div>
  <nav id="tabs"><button type="button" data-mode="button" aria-pressed="true">Button</button><button type="button" data-mode="banner" aria-pressed="false">Banner</button></nav>
  <textarea id="texts" placeholder="Text (multiple lines make one taller button)">:enderman: Enderman in Paris :chorus_fruit:&#10;🔥 Shadow Gang 💜</textarea>
  <fieldset>
    <legend>Size</legend>
    <label>Scale <input id="scale" type="number" min="1" max="8" value="2"></label>
    <label>Width (MC px, 0 = auto) <input id="width" type="number" min="0" value="0"></label>
    <button id="fit" type="button" class="secondary">Fit to text</button>
    <label>Icon size <input id="isize" type="number" min="4" max="18" value="12"></label>
  </fieldset>
  <fieldset>
    <legend>Colors</legend>
    <label>Color 1 <input id="c1" type="color" value="#865cff"></label>
    <label>Color 2 <input id="c2" type="color" value="#ff5cd6"></label>
    <button id="random" type="button" class="secondary">Random</button>
    <button id="swap" type="button" class="secondary">Swap</button>
  </fieldset>
  <fieldset>
    <legend>Motion</legend>
    <label>Speed (ms/frame) <input id="ms" type="number" min="20" max="200" step="10" value="60"></label>
    <label>Wave (px) <input id="wave" type="number" min="0" max="2" value="1"></label>
    <label><input id="shadow" type="checkbox" checked> Text shadow</label>
  </fieldset>
  <div id="out"></div>
  </div>
  <div id="icons"></div>
</main>
<script src="icons.js"></script>
<script type="module">
import { GIFEncoder, quantize, applyPalette } from "https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js";

const FONT_PNG = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACAAQMAAAD58POIAAAABlBMVEX///////9VfPVsAAAAAXRSTlMAQObYZgAAAtJJREFUeNrtk6GPG1cQxj90eqBSnoIWVPKoCgg02qtK7oECwyXlBgcMH+vCAQWjolWRoVUVWEUGBQUBgYaBkUL2L4gWXQZEt5l5jq3bVZILDMjn2efVb3+aefukxffMwruGhJh4B0sooO0aTikRgGgAypHAtLuAJtPGABQKKkZIBwduJFiaYdUhpTNg2JQNiP2WeboDWDLlXOlSc/YRnCFrkeecRAQgJMGWQlgNHESYk1LAnpZLCUPMLcCIEUdKQYOQBJ9JBCER80kiQJqArJpDtllr5gim2TY8eciDait9EBbJaMXCzJJCx6+Pgj90YOn7rabQ834v+E/MNKEYshX8cwGlh+CFWAqQE2DxKZylz6JlCmax562KR3vuCfAOZEvTBE7UmGE9HBBFAwKwSCgGERPhDJq9UOJYQCdi4LUQfwQbyeRdSPvQA/MoGIyAJZgDs6PkoKw4AeRD3thuDxw6fjVkIBxlK0mOHHa8FwFaYVF/9/DyBMTCyfGOpRhDbttyXJ15+XIKQMYlCSXEfDsBidMWOGwObS8eNQDguD1y8vOQyEzwqZwN7EnoZAwth2QH1LTpBDjwQC21EpSYC7js5NvNEogTsAKeT0ACCJ7Jwc6NLwMFdgDmUsl6jWlih5Jn3Xngx5vVCqfkdWmJ7hlwSXhoDIOD0uPx/PTbm6qqaqCurSpA/v19CoqhNfSuvr+r1Y23xaiu6qurs6F6d2/G3f296rlHbVUDqNyYAO8xBZUVnKD8PgsW9fXNu/F6fDdejOUSsAIW4+h1fWOPi4HiVKWBL4+DUpVdhkcMT8ZPAKvFwv4mRvXAGMfxZrG4GUe17QxPfEjtl7/EV4Jpfvl5Bn5NM/Anz8BfOgN/82M9/i9T5qEUf4jAGvjRF7wnoqeRbjsg9p0C0JieRmwddKQnI0bFujKQ9NQjRtyiQtcNbqC4WwAN4Iaqxg6eJc6JDz6OD74blGMNvZoZAAAAAElFTkSuQmCC";
const CHARS = ["\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000", "\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000", " !\"#$%&'()*+,-./", "0123456789:;<=>?", "@ABCDEFGHIJKLMNO", "PQRSTUVWXYZ[\\]^_", "`abcdefghijklmno", "pqrstuvwxyz{|}~\u0000", "\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000", "\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00a3\u0000\u0000\u0192", "\u0000\u0000\u0000\u0000\u0000\u0000\u00aa\u00ba\u0000\u0000\u00ac\u0000\u0000\u0000\u00ab\u00bb", "\u2591\u2592\u2593\u2502\u2524\u2561\u2562\u2556\u2555\u2563\u2551\u2557\u255d\u255c\u255b\u2510", "\u2514\u2534\u252c\u251c\u2500\u253c\u255e\u255f\u255a\u2554\u2569\u2566\u2560\u2550\u256c\u2567", "\u2568\u2564\u2565\u2559\u2558\u2552\u2553\u256b\u256a\u2518\u250c\u2588\u2584\u258c\u2590\u2580", "\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u2205\u2208\u0000", "\u2261\u00b1\u2265\u2264\u2320\u2321\u00f7\u2248\u00b0\u2219\u0000\u221a\u207f\u00b2\u25a0\u0000"];
const FRAMES = 40;
let ms = 60, wave = 1, shadow = true;  // set from the Motion inputs
let mode = "button";  // tab: "button" (centred) or "banner" (text scrolls, 1 MC px per frame)
const FILL = [93, 84, 104], TOP = [140, 118, 165], BOTTOM = [60, 40, 70], EDGE = [20, 4, 20];

// --- font: glyph alpha masks cut from ascii.png ---
const glyphs = {};
await new Promise(res => {
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = img.width; c.height = img.height;
    const ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0);
    const d = ctx.getImageData(0, 0, img.width, img.height).data;
    const cw = img.width / [...CHARS[0]].length, ch = img.height / CHARS.length;
    CHARS.forEach((line, row) => [...line].forEach((c, col) => {
      const mask = [];
      let w = 0;
      for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
        const a = d[((row * ch + y) * img.width + col * cw + x) * 4 + 3];
        if (a) { mask.push([x, y]); w = Math.max(w, x + 1); }
      }
      glyphs[c] = { w, mask };
    }));
    glyphs[" "] = { w: 3, mask: [] };
    res();
  };
  img.src = FONT_PNG;
});
const glyph = c => glyphs[c] || glyphs["?"];

// --- icons (icons.js, made by build_icons.py): 16px sources, drawn in full colour at iconSize ---
const iconSrc = Object.assign({}, ...Object.values(window.ICONS));
const iconImg = {};
await Promise.all(Object.entries(iconSrc).map(([name, src]) => new Promise(res => {
  const img = new Image();
  img.onload = res;
  img.src = src;
  iconImg[name] = img;
})));
let iconSize = 12;
const iconCache = {};
function emojiImg(e) {  // emoji drawn with the system emoji font on a 64px canvas, then treated like an icon
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const ctx = c.getContext("2d");
  ctx.font = "56px 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(e, 32, 36);
  return c;
}
function getIcon(name) {  // scaled pixel data, cached per size; smooth when shrinking, crisp when growing
  const key = name + "@" + iconSize;
  if (!iconCache[key]) {
    const img = iconImg[name] ||= emojiImg(name), k = iconSize / (iconSrc[name] ? 16 : 64);
    const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d");
    ctx.imageSmoothingEnabled = k < 1;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, 0, 0, w, h);
    iconCache[key] = { w, h, data: ctx.getImageData(0, 0, w, h).data };
  }
  return iconCache[key];
}
// text -> tokens: ":name:" and emoji become icons, everything else a glyph
const graphemes = new Intl.Segmenter();
const isEmoji = s => /\p{Extended_Pictographic}|\p{Regional_Indicator}|⃣/u.test(s);
const tokenize = text => text.split(/(:[a-z_]+:)/).flatMap(p =>
  /^:.*:$/.test(p) && iconSrc[p.slice(1, -1)] ? [{ icon: getIcon(p.slice(1, -1)) }] :
  [...graphemes.segment(p)].flatMap(({ segment: s }) => isEmoji(s) ? [{ icon: getIcon(s) }] : [...s]));
const tokW = t => t.icon ? t.icon.w : glyph(t).w;

// --- rendering (same look as mc_button_gif.py) ---
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t));
const grad = (u, c1, c2) => mix(c1, c2, (1 - Math.cos(u * 2 * Math.PI)) / 2);
const mod1 = x => ((x % 1) + 1) % 1;

// lines -> button height: 20 px for one line, each extra line adds a row pitch (taller when icons are used)
const pitch = rows => Math.max(10, rows.some(r => r.some(c => c.icon)) ? iconSize + 2 : 0);
const height = rows => 20 + (rows.length - 1) * pitch(rows);
const rowW = chars => chars.reduce((s, c) => s + tokW(c) + 1, 0) - 1;
const period = rows => Math.max(...rows.map(rowW)) + 24;  // banner: text repeats every widest line + gap

// t in [0,1) is one loop; a = t * cycles drives border/gradient/wave so long banner loops keep button speed
function renderFrame(rows, w, t, c1, c2, cycles = 1) {
  const a = t * cycles, H = height(rows), px = new Uint8ClampedArray(w * H * 4);
  const set = (x, y, c) => { const i = (y * w + x) * 4; px[i] = c[0]; px[i + 1] = c[1]; px[i + 2] = c[2]; px[i + 3] = 255; };
  for (let y = 0; y < H; y++) for (let x = 0; x < w; x++) set(x, y, FILL);
  for (let x = 1; x < w - 1; x++) { set(x, 1, TOP); set(x, H - 2, BOTTOM); set(x, H - 3, BOTTOM); }
  const perim = [];
  for (let x = 0; x < w; x++) perim.push([x, 0]);
  for (let y = 1; y < H; y++) perim.push([w - 1, y]);
  for (let x = w - 2; x >= 0; x--) perim.push([x, H - 1]);
  for (let y = H - 2; y > 0; y--) perim.push([0, y]);
  perim.forEach(([x, y], i) => set(x, y, mix(grad(mod1(i / perim.length * 2 - a), c1, c2), EDGE, 0.15)));
  const P = period(rows);
  rows.forEach((chars, row) => {
  const y0 = Math.floor((H - 8 - (rows.length - 1) * pitch(rows)) / 2) + row * pitch(rows);
  const starts = [];
  if (mode === "banner") for (let x = Math.floor((P - rowW(chars)) / 2) - Math.round(t * P); x < w; x += P) starts.push(x);
  else starts.push(Math.floor((w - rowW(chars)) / 2));
  for (let x0 of starts) chars.forEach((c, i) => {
    const dy = Math.round(wave * Math.sin(2 * Math.PI * (a * 2 - i / 8)));
    if (c.icon) {  // centred on the text line; 16px + bob stays inside the border rows
      const { w: iw, h: ih, data } = c.icon, iy = y0 + Math.floor((8 - ih) / 2) + dy;
      for (let y = 0; y < ih; y++) for (let x = 0; x < iw; x++) {
        const si = (y * iw + x) * 4, al = data[si + 3] / 255;
        const X = x0 + x, Y = iy + y, di = (Y * w + X) * 4;
        if (al && X >= 1 && X < w - 1 && Y >= 0 && Y < H)
          set(X, Y, [0, 1, 2].map(k => Math.round(px[di + k] * (1 - al) + data[si + k] * al)));
      }
      x0 += iw + 1;
      return;
    }
    const g = glyph(c);
    const col = grad(mod1(i / Math.max(chars.length, 1) - a), c1, c2);
    const shade = col.map(v => Math.floor(v / 4));
    const draw = (ox, oy, color) => g.mask.forEach(([gx, gy]) => {
      const x = x0 + ox + gx, y = y0 + oy + gy;
      if (x >= 1 && x < w - 1 && y >= 0 && y < H) set(x, y, color);
    });
    if (shadow) draw(1, dy + 1, shade);
    draw(0, dy, col);
    x0 += g.w + 1;
  });
  });
  return px;
}

function upscale(px, w, H, s) {
  const W = w * s, HH = H * s, out = new Uint8ClampedArray(W * HH * 4);
  for (let y = 0; y < HH; y++) for (let x = 0; x < W; x++) {
    const si = (Math.floor(y / s) * w + Math.floor(x / s)) * 4, di = (y * W + x) * 4;
    out[di] = px[si]; out[di + 1] = px[si + 1]; out[di + 2] = px[si + 2]; out[di + 3] = 255;
  }
  return out;
}

function makeGif(lines, scale, width, c1, c2) {
  const rows = lines.map(tokenize), H = height(rows);
  const w = width || (mode === "banner" ? 200 : Math.max(Math.max(...rows.map(rowW)) + 41, 200));
  const n = mode === "banner" ? period(rows) : FRAMES, cycles = Math.max(1, Math.round(n / FRAMES));
  const gif = GIFEncoder();
  for (let f = 0; f < n; f++) {
    const data = upscale(renderFrame(rows, w, f / n, c1, c2, cycles), w, H, scale);
    const palette = quantize(data, 256);
    gif.writeFrame(applyPalette(data, palette), w * scale, H * scale, { palette, delay: ms });
  }
  gif.finish();
  return new Blob([gif.bytes()], { type: "image/gif" });
}

// --- UI ---
const $ = id => document.getElementById(id);
let made = null;
for (const [cat, list] of Object.entries(window.ICONS)) {
  const row = document.createElement("div");
  row.className = "cat";
  row.innerHTML = `<span>${cat}</span><div></div>`;
  for (const [name, src] of Object.entries(list)) {
    const b = document.createElement("button");
    b.type = "button"; b.title = name;
    b.innerHTML = `<img src="${src}" alt="${name}">`;
    b.onclick = () => {
      const ta = $("texts");
      ta.setRangeText(`:${name}:`, ta.selectionStart, ta.selectionEnd, "end");
      ta.focus();
      update();
    };
    row.lastChild.append(b);
  }
  $("icons").append(row);
}
const getLines = () => $("texts").value.split("\n").map(s => s.trim()).filter(Boolean);
const clamp = (id, lo, hi, def) => Math.min(hi, Math.max(lo, $(id).value === "" ? def : +$(id).value));
function readOpts() {
  iconSize = clamp("isize", 4, 18, 12);
  ms = clamp("ms", 20, 200, 60);
  wave = clamp("wave", 0, 2, 1);
  shadow = $("shadow").checked;
}
// random pair: a bright hue plus its opposite (complement, ±15° jitter so pairs vary)
const hslHex = (h, s, l) => "#" + [0, 8, 4].map(n => {
  const k = (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, "0");
}).join("");
$("random").onclick = () => {
  const h = Math.random() * 360, d = 180 + (Math.random() * 30 - 15);
  $("c1").value = hslHex(h, 0.9, 0.62);
  $("c2").value = hslHex((h + d + 360) % 360, 0.9, 0.68);
  update();
};
$("swap").onclick = () => {
  [$("c1").value, $("c2").value] = [$("c2").value, $("c1").value];
  update();
};
$("fit").onclick = () => {  // widest line + 6 px padding each side
  readOpts();
  const lines = getLines();
  if (lines.length) $("width").value = Math.max(...lines.map(l => rowW(tokenize(l)))) + 12;
  update();
};
let timer;
function update() { clearTimeout(timer); timer = setTimeout(render, 200); }
document.querySelector("main").addEventListener("input", update);
for (const b of document.querySelectorAll("#tabs button")) b.onclick = () => {
  mode = b.dataset.mode;
  for (const o of document.querySelectorAll("#tabs button")) o.setAttribute("aria-pressed", o === b);
  update();
};
function render() {
  const lines = getLines();
  if (!lines.length) return;
  readOpts();
  const scale = clamp("scale", 1, 8, 2), width = +$("width").value || 0;
  const c1 = hex($("c1").value), c2 = hex($("c2").value);
  const old = made;
  made = URL.createObjectURL(makeGif(lines, scale, width, c1, c2));
  const name = ([...lines.join(" ").replace(/:[a-z_]+:/g, "")].filter(c => /[\p{L}\p{N}]/u.test(c)).join("") || "button") + (mode === "banner" ? "-banner" : "") + ".gif";
  const item = document.createElement("div");
  item.className = "item";
  const img = document.createElement("img");
  img.src = made; img.alt = lines.join(" / ");
  const a = document.createElement("a");
  a.className = "btn"; a.href = made; a.download = name; a.textContent = "Download";
  item.append(img, a);
  img.onload = () => { $("out").replaceChildren(item); if (old) URL.revokeObjectURL(old); };  // swap only once decoded, so the panel never collapses
};
render();
</script>
</body>
</html>
